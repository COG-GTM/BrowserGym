<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Skyhop — Book a flight</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f6fb; color: #1d2433; }
  header { background: #1f3a93; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 24px; }
  header h1 { font-size: 20px; margin: 0; }
  header nav a { color: #cfd8ff; margin-right: 16px; text-decoration: none; font-size: 14px; }
  main { padding: 20px 24px; }
  form { background: #fff; border-radius: 8px; padding: 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  label { font-size: 12px; color: #5b6475; display: flex; flex-direction: column; gap: 4px; }
  input, select { font-size: 14px; padding: 8px; border: 1px solid #c8cfdc; border-radius: 4px; }
  .row { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; }
  button { background: #ff7a1a; color: #fff; border: 0; border-radius: 4px; padding: 10px 18px; font-size: 14px; font-weight: bold; cursor: pointer; }
  #results { margin-top: 16px; display: none; }
  #results.show { display: block; }
  .flight { background: #fff; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .flight .price { font-weight: bold; font-size: 18px; }
  #confirm { margin-top: 12px; padding: 12px; background: #e3f7e9; border: 1px solid #77c58f; border-radius: 6px; display: none; }
  #confirm.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>Skyhop</h1>
  <nav><a href="#">Flights</a><a href="#">Hotels</a><a href="#">My trips</a></nav>
</header>
<main>
  <form id="search" onsubmit="event.preventDefault(); search();">
    <label>From <input id="from" name="from" placeholder="City or airport" /></label>
    <label>To <input id="to" name="to" placeholder="City or airport" /></label>
    <label>Depart <input id="depart" name="depart" type="date" value="2026-11-03" /></label>
    <label>Cabin
      <select id="cabin" name="cabin">
        <option>Economy</option><option>Premium economy</option><option>Business</option>
      </select>
    </label>
    <label>Passengers <input id="pax" name="pax" type="number" min="1" value="1" /></label>
    <div class="row">
      <label style="flex-direction: row; align-items: center;"><input id="direct" type="checkbox" /> Direct flights only</label>
      <button id="go" type="submit">Search flights</button>
    </div>
  </form>
  <section id="results" aria-label="Results"></section>
  <div id="confirm" role="status"></div>
</main>
<script>
  function search() {
    const from = document.getElementById('from').value || '?';
    const to = document.getElementById('to').value || '?';
    const cabin = document.getElementById('cabin').value;
    const flights = [
      ['SH 214', '07:10 → 09:05', 412], ['SH 218', '12:45 → 14:40', 389], ['SH 230', '19:20 → 21:15', 455]
    ];
    const r = document.getElementById('results');
    r.innerHTML = '<h2 style="font-size:16px">' + flights.length + ' flights ' + from + ' → ' + to + ' · ' + cabin + '</h2>' +
      flights.map(([n, t, p]) => '<div class="flight"><span><b>' + n + '</b> · ' + t + ' · direct</span><span class="price">€' + p +
        '</span><button type="button" onclick="pick(\'' + n + '\', ' + p + ')">Select ' + n + '</button></div>').join('');
    r.classList.add('show');
  }
  function pick(n, p) {
    const c = document.getElementById('confirm');
    c.textContent = 'Flight ' + n + ' held for 15 minutes · €' + p;
    c.classList.add('show');
  }
</script>
</body>
</html>
