name: Side images

# Builds the Side container images (deploy/**). Images are pushed to GHCR only on pushes to
# side/main; pull requests build (with the GitHub Actions buildx cache) without pushing.
on:
  push:
    branches: [side/main]
    paths:
      - "deploy/**"
      - "apps/api/**"
      - "apps/web/**"
      - "services/**"
      - "packages/**"
      - "browsergym/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "yarn.lock"
      - ".github/workflows/side-images.yml"
  pull_request:
    branches: [side/main]
    paths:
      - "deploy/**"
      - "apps/api/**"
      - "apps/web/**"
      - "services/**"
      - "packages/**"
      - "browsergym/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "yarn.lock"
      - ".github/workflows/side-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: side-images-${{ github.ref }}
  cancel-in-progress: true

env:
  PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/side/main' }}

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --profile tools config --quiet
          echo "compose config OK"

  build:
    needs: compose-config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [runner, api, notifications, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/side-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ env.PUSH == 'true' }}
            type=sha,format=short
            type=ref,event=pr

      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' && (matrix.image == 'runner' || matrix.image == 'api') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=side-${{ matrix.image }}
          cache-to: type=gha,scope=side-${{ matrix.image }},mode=max

      - name: Runner smoke test
        if: matrix.image == 'runner' && env.PUSH != 'true'
        run: |
          tag="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm --shm-size=1g "$tag" python -c "import browsergym.core; from playwright.sync_api import sync_playwright; print('imports ok')"
          docker run --rm --shm-size=1g "$tag" python /opt/side/bin/smoke-runner.py
