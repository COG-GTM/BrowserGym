[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "side-api"
version = "0.1.0"
description = "Side API server: launch, watch and replay BrowserGym runs (implements contracts/openapi.yaml)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
browsergym = ["browsergym-core", "browsergym-miniwob"]
dev = [
    "pytest>=8",
    "openapi-core>=0.19",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["side_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
