[project]
name = "browsergym-meta"
description = "BrowserGym: a gym environment for web task automation in the Chromium browser"
dynamic = ["version"]
[tool.setuptools]
packages = []  # meta distribution, packages are included as dependencies

# --- uv workspace -----------------------------------------------------------
# `uv sync` installs browsergym-core + the dev tools (enough for `make test-core`).
# `uv sync --all-packages` installs every browsergym/* member (pulls torch via visualwebarena).
[tool.uv.workspace]
members = [
    "browsergym",
    "browsergym/core",
    "browsergym/miniwob",
    "browsergym/webarena",
    "browsergym/webarenalite",
    "browsergym/visualwebarena",
    "browsergym/assistantbench",
]
# browsergym-experiments is wired in as an editable path source (not a member) because its
# `all` extra references the misspelled `browsergym-experiment[...]`, which uv cannot lock.

[tool.uv.sources]
browsergym = { workspace = true }
browsergym-core = { workspace = true }
browsergym-miniwob = { workspace = true }
browsergym-webarena = { workspace = true }
browsergym-webarenalite = { workspace = true }
browsergym-visualwebarena = { workspace = true }
browsergym-experiments = { path = "browsergym/experiments", editable = true }
browsergym-assistantbench = { workspace = true }

[tool.uv]
# playwright==1.44 (browsergym-core) pins greenlet==3.0.3, which has no Python 3.13 wheel and
# fails to build from source there; greenlet>=3.1.1 keeps the same API and ships 3.13 wheels.
override-dependencies = [
    "greenlet==3.0.3; python_version < '3.13'",
    "greenlet>=3.1.1; python_version >= '3.13'",
]

[dependency-groups]
lint = [
    "ruff==0.17.1",
    "black[jupyter]==24.2.0",
    "blacken-docs",
    "pre-commit",
]
test = [
    "browsergym-core",
    "pytest>=7.3.2",
    "pytest-xdist",
    "pytest-playwright",
    "tenacity",
    "regex",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
filterwarnings = [
    'ignore::UserWarning:gymnasium.*:',  # too many "The obs is not within the observation space." warnings.
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "serial: mark test to be run sequantially (deselect with '-m \"not serial\"')"
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/src/generated"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors (ruff defaults) + isort. Formatting stays with black.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["browsergym", "bgym"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export their public API.
"__init__.py" = ["F401"]
# Baseline: pre-existing violations at the time ruff was adopted. Fix a file, then drop its entry.
"browsergym/assistantbench/src/browsergym/assistantbench/__init__.py" = ["F541"]
