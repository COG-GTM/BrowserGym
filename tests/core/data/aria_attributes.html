<!DOCTYPE html>
<html>
<head>
    <title>ARIA attributes</title>
</head>
<body>
    <button id="no-aria">No ARIA</button>
    <button id="with-description" aria-description="Saves the form">Save</button>
    <div id="with-roledescription" role="button" aria-roledescription="slide">Slide 1</div>
    <button id="with-multiline-description" aria-description="first line
second line">Multiline</button>
    <button id="with-bid-like-description" aria-description="browsergym_id_x not ours">Tricky</button>
    <button id="shared-a" aria-description="Shared description">Shared A</button>
    <button id="shared-b" aria-description="Shared description">Shared B</button>
</body>
</html>
